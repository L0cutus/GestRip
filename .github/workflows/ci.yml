# CI su GitHub: build senza CGO, vet, staticcheck, test, segreti.
# La copertura dell'inventario gira solo in locale finché l'inventario non è nel repo
# (PIANO §8.3, A2). Azioni fissate per hash di commit.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
      GESTRIP_TEST_CPU_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go build -o /dev/null ./...
      - run: go test -count=1 ./...
      - name: gitleaks 8.30.1
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
