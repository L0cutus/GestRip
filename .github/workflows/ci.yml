# CI su GitHub: build senza CGO, vet, staticcheck, errcheck, test, copertura dell'inventario, segreti.
# La copertura legge l'elenco pubblico docs/inventario-elenco.tsv: l'inventario completo è privato
# (PIANO §8.3, A2). Azioni fissate per hash di commit.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-trimpath -tags=nodynamic"
      GESTRIP_TEST_CPU_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet -tags nodynamic ./...
      - run: go tool staticcheck -tags nodynamic ./...
      - run: go tool errcheck -tags nodynamic -exclude scripts/errcheck-escluse.txt ./...
      - run: go build -tags nodynamic -o /dev/null ./...
      - name: test
        env:
          # Limite di CPU del figlio delle foto nei soli test (slice 037e; produzione sempre 8 s). Sul
          # runner, con i pacchetti insieme su 4 CPU, il JPEG più pesante ha usato fino a 7,92 s e una
          # volta è stato ucciso a 8 s (run 41305328853): 30 s sono quasi 4 volte il massimo misurato,
          # restano sotto i 2 minuti d'orologio dei test (tempoFotoGrandi) e sotto i 60 s che il figlio
          # accetta. Con la variabile i test non guardano la soglia di 5 s di pc-fisso: la CPU va nel log.
          GESTRIP_TEST_CPU_FIGLIO: "30"
        run: go test -tags nodynamic -count=1 -json ./... > go-test.json || { go test -tags nodynamic -count=1 ./...; exit 1; }
      - name: copertura dell'inventario
        run: go run -tags nodynamic ./tools/copertura -risultati go-test.json -verifica
      - name: gitleaks 8.30.1
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
